name: Rebuild aggregate data and calendar ICS

on:
  push:
    branches: [main]
    paths:
      - 'data/calendar/**'
      - 'data/resources/**'
      - 'data/*.json'
      - 'scripts/build_content.py'
      - 'scripts/generate_calendar.py'
  schedule:
    - cron: "0 5 * * *"  # Daily at 5 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge per-item CMS files into the aggregate data/*.json files
        run: python3 scripts/build_content.py

      - name: Generate calendar.ics
        run: python3 scripts/generate_calendar.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/*.json calendar.ics; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "4DASISTAS Bot"
          git config user.email "bot@4dasistas.ca"
          git add data/*.json calendar.ics
          git commit -m "Auto-rebuild aggregate data + calendar.ics [skip ci]"
          git push

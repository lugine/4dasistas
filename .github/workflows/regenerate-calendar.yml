name: Regenerate Calendar ICS

on:
  push:
    branches: [main]
    paths:
      - 'data/*.json'
      - 'scripts/generate_calendar.py'
  schedule:
    - cron: "0 5 * * *"  # Daily at 5 AM UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Generate calendar.ics
        run: python3 scripts/generate_calendar.py
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install wrangler
        run: npm install -g wrangler
      
      - name: Sync data to Worker KV
        if: secrets.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd workers
          for file in ../data/*.json; do
            key=$(basename "$file" .json)
            echo "Syncing $key to KV..."
            wrangler kv key put --binding=SITE_DATA "$key" --path="$file"
          done
          
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet calendar.ics; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "4DASISTAS Bot"
          git config user.email "bot@4dasistas.ca"
          git add calendar.ics
          git commit -m "Auto-regenerate calendar.ics from JSON data [skip ci]"
          git push

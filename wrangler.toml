# Deploys the whole site (index.html, data/*.json, calendar.ics, assets/, admin/)
# as static assets on the existing "4dasistas" Worker that 4dasistas.ca points to.
#
# Connect this repo in the Cloudflare dashboard under Workers & Pages so every
# push to main deploys automatically — see AGENT-COORDINATION.md for the
# one-time setup steps.
# Build command: python3 scripts/build_content.py && python3 scripts/generate_calendar.py
#   (build_content.py merges the per-entry data/calendar/*.json and
#   data/resources/*.json files the CMS writes into the aggregate data/*.json
#   files this site actually reads — skip it and new CMS entries never show up)
# Deploy command: npx wrangler deploy

name = "4dasistas"
main = "workers/src/worker.js"
compatibility_date = "2026-08-21"

routes = [
	{ pattern = "4dasistas.ca/api/*", zone_name = "4dasistas.ca" },
	{ pattern = "www.4dasistas.ca/api/*", zone_name = "4dasistas.ca" }
]

[triggers]
crons = ["0 13 * * *"]

[[kv_namespaces]]
binding = "SITE_DATA"
id = "f70e43c88d1043439e400e127faaf90e"

[vars]
SITE_ORIGIN = "https://4dasistas.ca"
FROM_EMAIL = "4DASISTAS <updates@4dasistas.ca>"

[assets]
directory = "."

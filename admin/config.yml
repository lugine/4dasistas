# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: lugine/4dasistas
  branch: main
  identity_url: https://auth.decapbridge.com/sites/0e272b00-698f-4375-beef-d82a66a2ca77
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

media_folder: "admin/uploads"
public_folder: "/admin/uploads"

site_url: https://4dasistas.ca
display_url: https://4dasistas.ca

collections:

  - name: "maintenance"
    label: "🛠️ Maintenance Mode"
    files:
      - file: "data/maintenance.json"
        label: "Maintenance Mode"
        name: "maintenance"
        fields:
          - { label: "Show maintenance screen to visitors?", name: "enabled", widget: "boolean", default: false, hint: "Turn this ON to hide the site behind a 'be right back' message. Turn OFF to show the real site again." }
          - { label: "Message shown to visitors", name: "message", widget: "string", default: "We're fixing something — be right back!" }
          - { label: "Smaller subtext", name: "subtext", widget: "string", required: false, default: "This won't take long. Thanks for your patience 💛" }

  - name: "sports"
    label: "Sports"
    files:
      - file: "data/sports.json"
        label: "Sports"
        name: "sports"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tag / Type (e.g. Badminton) — change this to switch category", name: "tag", widget: "string" }
              - { label: "ID (no spaces, unique)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Sport Key (lowercase, e.g. badminton)", name: "sportKey", widget: "string" }
              - label: "Simple one-off date (optional — use this OR the recurring fields below, not both)"
                name: "eventDate"
                widget: "date"
                required: false
                hint: "Pick a date — the site automatically builds the display text and places it on the calendar. Leave blank for recurring events."
              - { label: "Date text (shown on card — only needed if not using the simple date above)", name: "date", widget: "string", required: false }
              - label: "Recurring weekdays (leave empty if one-off)"
                name: "days"
                widget: "select"
                multiple: true
                required: false
                options: ["sun","mon","tue","wed","thu","fri","sat"]
              - { label: "Recurring: starts on (optional — leave blank for always)", name: "recurStart", widget: "date", required: false }
              - { label: "Recurring: ends on (optional — leave blank for indefinite)", name: "recurEnd", widget: "date", required: false }
              - { label: "Specific calendar date (YYYY-MM-DD, legacy field — prefer the simple date above)", name: "calDate", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "location-autocomplete", required: false }
              - { label: "Organizer name", name: "organizer", widget: "string", required: false }
              - { label: "Contact", name: "contact", widget: "string", required: false }
              - { label: "Price", name: "price", widget: "string", required: false }
              - { label: "Registration info", name: "registration", widget: "string", required: false }
              - { label: "Registration deadline", name: "registrationDeadline", widget: "date", required: false }
              - { label: "Description", name: "desc", widget: "text", required: false }
              - { label: "WhatsApp link", name: "whatsapp", widget: "string", required: false }
              - { label: "Instagram link", name: "instagram", widget: "string", required: false }
              - { label: "Website link", name: "website", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }

  - name: "gatherings"
    label: "Activities & Gatherings — Gatherings"
    files:
      - file: "data/gatherings.json"
        label: "Gatherings"
        name: "gatherings"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tag / Type — change this to switch category", name: "tag", widget: "string", default: "Gathering" }
              - { label: "ID (no spaces, unique)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Simple one-off date (optional — use this OR the recurring fields below, not both)"
                name: "eventDate"
                widget: "date"
                required: false
                hint: "Pick a date — the site automatically builds the display text and places it on the calendar. Leave blank for recurring or ongoing."
              - { label: "Date text (shown on card — only needed if not using the simple date above)", name: "date", widget: "string", required: false }
              - label: "Recurring weekdays (leave empty if one-off/ongoing)"
                name: "days"
                widget: "select"
                multiple: true
                required: false
                options: ["sun","mon","tue","wed","thu","fri","sat"]
              - { label: "Recurring: starts on (optional)", name: "recurStart", widget: "date", required: false }
              - { label: "Recurring: ends on (optional)", name: "recurEnd", widget: "date", required: false }
              - { label: "Specific calendar date (YYYY-MM-DD, legacy field — prefer the simple date above)", name: "calDate", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "location-autocomplete", required: false }
              - { label: "Registration deadline", name: "registrationDeadline", widget: "date", required: false }
              - label: "Hijab-off confirmed?"
                name: "hijabOff"
                widget: "select"
                options: ["Not specified", "Yes", "No"]
                default: "Not specified"
                required: false
              - { label: "Description", name: "desc", widget: "text", required: false }
              - { label: "Instagram link", name: "instagram", widget: "string", required: false }
              - { label: "Website link", name: "website", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }

  - name: "dayactivities"
    label: "Activities & Gatherings — Day Activities"
    files:
      - file: "data/dayactivities.json"
        label: "Day Activities"
        name: "dayactivities"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tag / Type — change this to switch category", name: "tag", widget: "string", default: "Day Activity" }
              - { label: "ID (no spaces, unique)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Simple one-off date"
                name: "eventDate"
                widget: "date"
                required: false
                hint: "Pick a date — the site automatically builds the display text and places it on the calendar."
              - { label: "Date text (only needed if not using the simple date above)", name: "date", widget: "string", required: false }
              - { label: "Calendar date (YYYY-MM-DD, legacy field — prefer the simple date above)", name: "calDate", widget: "string", required: false }
              - { label: "City", name: "city", widget: "select", options: ["Mississauga", "Oakville", "Toronto", "Burlington", "Milton"] }
              - { label: "Location", name: "location", widget: "location-autocomplete", required: false }
              - { label: "Registration deadline", name: "registrationDeadline", widget: "date", required: false }
              - { label: "Description", name: "desc", widget: "text", required: false }

  - name: "trips"
    label: "Trips"
    files:
      - file: "data/trips.json"
        label: "Trips"
        name: "trips"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tag / Type — change this to switch category", name: "tag", widget: "string", default: "Trip" }
              - { label: "ID (no spaces, unique)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Simple one-off date"
                name: "eventDate"
                widget: "date"
                required: false
                hint: "Pick a date — the site automatically builds the display text and places it on the calendar."
              - { label: "Date text (only needed if not using the simple date above)", name: "date", widget: "string", required: false }
              - { label: "Calendar date (YYYY-MM-DD, legacy field — prefer the simple date above)", name: "calDate", widget: "string", required: false }
              - { label: "Trip type", name: "tripType", widget: "select", options: ["domestic", "international"] }
              - { label: "Location", name: "location", widget: "location-autocomplete", required: false }
              - { label: "Price", name: "price", widget: "string", required: false }
              - { label: "Registration deadline", name: "registrationDeadline", widget: "date", required: false }
              - { label: "Description", name: "desc", widget: "text", required: false }

  - name: "mosquegatherings"
    label: "Mosque Gatherings"
    files:
      - file: "data/mosquegatherings.json"
        label: "Mosque Gatherings"
        name: "mosquegatherings"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tag / Type — change this to switch category", name: "tag", widget: "string", default: "Mosque Gathering" }
              - { label: "ID (no spaces, unique)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Simple one-off date (optional — use this OR the recurring fields below, not both)"
                name: "eventDate"
                widget: "date"
                required: false
                hint: "Pick a date — the site automatically builds the display text and places it on the calendar. Leave blank for recurring or ongoing."
              - { label: "Date text (shown on card — only needed if not using the simple date above)", name: "date", widget: "string", required: false }
              - label: "Recurring weekdays (leave empty if one-off/ongoing)"
                name: "days"
                widget: "select"
                multiple: true
                required: false
                options: ["sun","mon","tue","wed","thu","fri","sat"]
              - { label: "Recurring: starts on (optional)", name: "recurStart", widget: "date", required: false }
              - { label: "Recurring: ends on (optional)", name: "recurEnd", widget: "date", required: false }
              - { label: "Specific calendar date (YYYY-MM-DD, legacy field — prefer the simple date above)", name: "calDate", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "location-autocomplete", required: false }
              - { label: "Organizer name", name: "organizer", widget: "string", required: false }
              - { label: "Contact", name: "contact", widget: "string", required: false }
              - { label: "Description", name: "desc", widget: "text", required: false }
              - { label: "WhatsApp link", name: "whatsapp", widget: "string", required: false }
              - { label: "Instagram link", name: "instagram", widget: "string", required: false }
              - { label: "Website link", name: "website", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }

  - name: "clubs"
    label: "Gals Clubs"
    files:
      - file: "data/clubs.json"
        label: "Clubs"
        name: "clubs"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID (no spaces, unique)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Sign Up link", name: "signup", widget: "string" }

  - name: "organizations"
    label: "Resources — Organizations"
    files:
      - file: "data/organizations.json"
        label: "Organizations"
        name: "organizations"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Category (leave as organizations)", name: "category", widget: "hidden", default: "organizations" }
              - { label: "ID (no spaces, unique)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Location", name: "location", widget: "location-autocomplete" }
              - { label: "Ownership / leadership note", name: "ownedBy", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Instagram link", name: "instagram", widget: "string", required: false }
              - { label: "Website link", name: "website", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }

  - name: "resources"
    label: "Resources — Muslim Women-Owned Resources"
    files:
      - file: "data/resources.json"
        label: "Muslim Women-Owned Resources"
        name: "resources"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Category — change this to switch type", name: "category", widget: "select", options: ["cafes", "shops", "restaurants", "beautycare", "mentalhealth", "bakeries", "mosqueprograms"] }
              - { label: "ID (no spaces, unique)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Type (e.g. Boutique, Bakery & Café)", name: "type", widget: "string" }
              - { label: "Location", name: "location", widget: "location-autocomplete" }
              - { label: "Hours / date info", name: "date", widget: "string", required: false }
              - { label: "Ownership note", name: "ownedBy", widget: "string", required: false }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Latitude (for map)", name: "lat", widget: "number", value_type: "float", required: false }
              - { label: "Longitude (for map)", name: "lng", widget: "number", value_type: "float", required: false }
              - { label: "Google Maps link", name: "mapsUrl", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Instagram link", name: "instagram", widget: "string", required: false }
              - { label: "Website link", name: "website", widget: "string", required: false }

              - { label: "Email", name: "email", widget: "string", required: false }

# wrangler.toml for 4DASISTAS tab editor Cloudflare Worker
name = "4dasistas-editor"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# KV namespace for storing site data
# Run: wrangler kv namespace create "SITE_DATA"
# Then paste the id below
[[kv_namespaces]]
binding = "SITE_DATA"
id = "YOUR_KV_NAMESPACE_ID"

